<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Neon Tbilisi logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#17101b"/>
      <stop offset="0.62" stop-color="#08070b"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="pinkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orangeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000"/>
  <circle cx="256" cy="256" r="214" fill="url(#bg)"/>

  <path
    d="M94 245C93 146 159 70 257 70c98 0 165 75 165 173"
    fill="none"
    stroke="#b951ff"
    stroke-width="9"
    stroke-linecap="round"
    filter="url(#pinkGlow)"
  />
  <path
    d="M422 265c-4 101-73 178-166 178S97 366 92 266"
    fill="none"
    stroke="#ff593a"
    stroke-width="9"
    stroke-linecap="round"
    filter="url(#orangeGlow)"
  />

  <g transform="rotate(-6 256 235)">
    <text
      x="252"
      y="275"
      text-anchor="middle"
      font-family="'Brush Script MT','Segoe Script','Comic Sans MS',cursive"
      font-size="135"
      fill="none"
      stroke="#ff3f9f"
      stroke-width="17"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#pinkGlow)"
    >Neon</text>
    <text
      x="252"
      y="275"
      text-anchor="middle"
      font-family="'Brush Script MT','Segoe Script','Comic Sans MS',cursive"
      font-size="135"
      fill="none"
      stroke="#ff8f45"
      stroke-width="6"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#orangeGlow)"
    >Neon</text>
    <text
      x="252"
      y="275"
      text-anchor="middle"
      font-family="'Brush Script MT','Segoe Script','Comic Sans MS',cursive"
      font-size="135"
      fill="#120712"
      opacity="0.18"
    >Neon</text>
  </g>

  <text
    x="256"
    y="355"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54"
    font-weight="800"
    letter-spacing="5"
    fill="#34d8ff"
    stroke="#34d8ff"
    stroke-width="2"
    filter="url(#blueGlow)"
  >TBILISI</text>
</svg>
